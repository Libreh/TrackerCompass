plugins {
    id "com.modrinth.minotaur" version "2.+"
}

base.archivesName = "trackercompass"

loom {
    mods {
        "trackercompass" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    api project(path: ":trackercompass-api")
    include project(path: ":trackercompass-api")

    compileOnly "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
    localRuntime "me.lucko:fabric-permissions-api:${project.permissions_api_version}"
    include "me.lucko:fabric-permissions-api:${project.permissions_api_version}"

    compileOnly "eu.pb4:sgui:${project.sgui_version}"
    localRuntime "eu.pb4:sgui:${project.sgui_version}"
    include "eu.pb4:sgui:${project.sgui_version}"

    compileOnly "eu.pb4:placeholder-api:${project.placeholder_api_version}"
    localRuntime "eu.pb4:placeholder-api:${project.placeholder_api_version}"
    include "eu.pb4:placeholder-api:${project.placeholder_api_version}"

    compileOnly "eu.pb4:predicate-api:${project.predicate_api_version}"
    localRuntime "eu.pb4:predicate-api:${project.predicate_api_version}"
    include "eu.pb4:predicate-api:${project.predicate_api_version}"

    compileOnly "me.libreh:worldreset-api:${project.worldreset_api_version}"
    localRuntime "me.libreh:worldreset-api:${project.worldreset_api_version}"
}

var isStable = project.is_stable == "true"

if (System.getenv("MODRINTH")) {
    modrinth {
        token = System.getenv("MODRINTH")
        projectId = '6jEbbeXn'
        versionNumber = "" + version
        versionType = isStable ? "release" : "beta"
        uploadFile = jar
        gameVersions = [((String) project.minecraft_version)]
        changelog = System.getenv("CHANGELOG")
        loaders = ["fabric", "quilt"]
        dependencies {
            required.project "fabric-api"
            embedded.project "fabric-permissions-api"
        }
    }

    jar {
        finalizedBy project.tasks.modrinth
    }
}
