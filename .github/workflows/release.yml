name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/loom-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # worldreset-api isn't on a public maven, so build it into ~/.m2 first.
      # Clone the tag matching worldreset_api_version so releases don't track the moving 26.1 branch.
      - name: Publish worldreset-api to maven local
        run: |
          git clone --depth 1 --branch 0.2.1+26.1.2 https://github.com/Libreh/WorldReset.git ../WorldReset
          cd ../WorldReset
          chmod +x gradlew
          ./gradlew :worldreset-api:publishToMavenLocal

      - name: Build with Gradle
        run: ./gradlew build
        env:
          MODRINTH: ${{ secrets.MODRINTH }}
          CHANGELOG: ${{ github.event.release.body }}
      - name: Upload GitHub release
        if: github.event_name == 'release'
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'trackercompass/build/libs/*.jar;trackercompass-api/build/libs/*.jar;!*/build/libs/*-sources.jar;!*/build/libs/*-dev.jar'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
