# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25    # Minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      # worldreset-api isn't on a public maven, so build it into ~/.m2 first.
      # Clone the tag matching worldreset_api_version so builds don't track the moving 26.1 branch.
      - name: publish worldreset-api to maven local
        shell: bash
        run: |
          git clone --depth 1 --branch 0.2.1+26.1.2 https://github.com/Libreh/WorldReset.git ../WorldReset
          cd ../WorldReset
          chmod +x gradlew
          ./gradlew :worldreset-api:publishToMavenLocal
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: '*/build/libs/'
